<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop All Gadgets — ODDAWURLD</title>
    <meta
      name="description"
      content="Browse premium headphones, earbuds, smartwatches, phones, accessories and gaming gear. Filter by category, brand, price and rating."
    />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="shop">
    <div class="page-loader" id="pageLoader">
      <div class="loader-ring">
        <img src="assets/icons/logo-mark.svg" alt="" />
      </div>
      <span>ODDAWURLD</span>
    </div>

    <div id="site-header"></div>

    <main>
      <section class="page-hero">
        <div class="container-xl">
          <nav aria-label="breadcrumb" class="enter" style="--d: 0.1s">
            <ol class="crumbs">
              <li>
                <a href="index.html"><i class="bi bi-house-door"></i> Home</a>
              </li>
              <li class="active">Shop</li>
            </ol>
          </nav>
          <h1 class="page-title enter" style="--d: 0.2s">
            The <span class="script">Gadget</span> Store
          </h1>
          <p class="page-sub enter" style="--d: 0.3s">
            Premium tech, curated for people who live one step ahead.
          </p>
        </div>
      </section>

      <section class="section pt-0" id="shopTop">
        <div class="container-xl">
          <div class="row g-4">
            <!-- Sidebar -->
            <aside class="col-lg-3">
              <div
                class="offcanvas-lg offcanvas-start odda-offcanvas"
                tabindex="-1"
                id="filterPanel"
                aria-labelledby="filterPanelLabel"
              >
                <div class="offcanvas-header d-lg-none">
                  <h5 class="offcanvas-title" id="filterPanelLabel">
                    <i class="bi bi-sliders text-lime"></i> Filters
                  </h5>
                  <button
                    type="button"
                    class="icon-btn"
                    data-bs-dismiss="offcanvas"
                    data-bs-target="#filterPanel"
                    aria-label="Close"
                  >
                    <i class="bi bi-x-lg"></i>
                  </button>
                </div>
                <div class="offcanvas-body flex-column">
                  <div class="filter-box">
                    <h6 class="filter-title">
                      <i class="bi bi-grid-3x3-gap"></i> Categories
                    </h6>
                    <div id="filterCats"></div>
                  </div>
                  <div class="filter-box">
                    <h6 class="filter-title">
                      <i class="bi bi-cash-coin"></i> Max Price
                      <span class="ms-auto text-lime" id="priceValue"
                        >$900</span
                      >
                    </h6>
                    <input
                      type="range"
                      class="range-x"
                      id="priceRange"
                      min="0"
                      max="900"
                      step="10"
                      aria-label="Maximum price"
                    />
                    <div
                      class="d-flex justify-content-between small text-muted-x mt-2"
                    >
                      <span>$0</span><span>$900+</span>
                    </div>
                  </div>
                  <div class="filter-box">
                    <h6 class="filter-title">
                      <i class="bi bi-award"></i> Brands
                    </h6>
                    <div id="filterBrands"></div>
                  </div>
                  <div class="filter-box">
                    <h6 class="filter-title">
                      <i class="bi bi-star"></i> Rating
                    </h6>
                    <div id="filterRatings"></div>
                  </div>
                  <button class="btn btn-ghost w-100" data-reset-filters>
                    <i class="bi bi-arrow-counterclockwise"></i> Reset filters
                  </button>
                  <div class="side-promo mt-4">
                    <img
                      src="assets/images/vr-headset.jpg"
                      alt="Zenith VR"
                      loading="lazy"
                    />
                    <div>
                      <span class="eyebrow">Limited deal</span>
                      <h6>Zenith VR — save 14%</h6>
                      <a href="product.html?id=zenith-vr" class="link-arrow"
                        >Shop now <i class="bi bi-arrow-right"></i
                      ></a>
                    </div>
                  </div>
                </div>
              </div>
            </aside>

            <!-- Products -->
            <div class="col-lg-9">
              <div class="shop-toolbar glass-panel reveal">
                <form class="search-inline" role="search">
                  <i class="bi bi-search"></i>
                  <input
                    type="search"
                    id="shopSearch"
                    class="form-control"
                    placeholder="Search products…"
                    aria-label="Search products"
                  />
                </form>
                <p class="shop-count" id="shopCount"></p>
                <div class="toolbar-right">
                  <button
                    class="btn btn-ghost btn-sm d-lg-none"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#filterPanel"
                  >
                    <i class="bi bi-sliders"></i> Filters
                  </button>
                  <select
                    class="form-select form-select-sm select-x"
                    id="shopSort"
                    aria-label="Sort products"
                  >
                    <option value="featured">Sort: Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                    <option value="discount">Biggest Discount</option>
                    <option value="name">Name A–Z</option>
                  </select>
                  <div class="view-toggle">
                    <button data-view="grid" aria-label="Grid view">
                      <i class="bi bi-grid-3x3-gap-fill"></i>
                    </button>
                    <button data-view="list" aria-label="List view">
                      <i class="bi bi-list-ul"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="active-chips" id="activeChips"></div>

              <div class="shop-grid stagger" id="shopGrid"></div>

              <div class="shop-empty d-none" id="shopEmpty">
                <div class="drawer-empty-icon">
                  <i class="bi bi-search"></i>
                </div>
                <h5>No gadgets match your filters</h5>
                <p class="text-muted-x">
                  Try a different search term or reset the filters.
                </p>
                <button class="btn btn-lime" data-reset-filters>
                  Reset filters
                </button>
              </div>

              <nav class="pager" id="shopPager" aria-label="Pagination"></nav>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/main.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/forms.js"></script>
  </body>
</html>
